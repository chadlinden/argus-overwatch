name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: apps/pipeline — lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[llm,dev]"
      - name: Lint
        run: ruff check . ../../scripts
      - name: Test
        run: pytest
