[project]
name = "argus-overwatch"
version = "4.0.0"
description = "File-first news synthesizer with bounded synthesis, context prioritization, model routing, and quality evaluation."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "feedparser>=6.0.11",
  "pyyaml>=6.0.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "model2vec>=0.3",
  "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]
# Opt-in cloud LLM synthesis. Not needed for the local-Ollama path.
llm = [
  "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
